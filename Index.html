function duration(ms){const s=Math.max(0,Math.floor(ms/1000));return `${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}

async function filesToMedia(files){const list=[...files];if(list.length>8)throw Error('Please add up to 8 files at a time.');return Promise.all(list.map(file=>{if(!/^(image\/(png|jpeg|gif|webp|avif)|video\/(mp4|webm|ogg|quicktime))$/i.test(file.type))throw Error('Use PNG, JPG, GIF, WebP, AVIF, MP4, WebM, Ogg, or MOV files.');if(file.size>25*1024*1024)throw Error('Each file must be smaller than 25 MB.');return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({id:uid(),name:file.name,type:file.type,url:r.result});r.onerror=()=>reject(Error('Unable to read '+file.name));r.readAsDataURL(file)})}))}

function entryEditor(existing=null,day=localDay(focus)){const stamp=existing?new Date(existing.timestamp):new Date();if(!existing){const d=parseDay(day);stamp.setFullYear(d.getFullYear(),d.getMonth(),d.getDate())}const dateValue=localDay(stamp)+'T'+String(stamp.getHours()).padStart(2,'0')+':'+String(stamp.getMinutes()).padStart(2,'0');modal(`<h2>${existing?'Edit entry':'A moment worth keeping'}</h2><form id="entryForm"><div class="twocol"><label>Date & time<input name="timestamp" type="datetime-local" required value="${dateValue}"></label><label>Kind<select name="type">${['journal','habit','goal','media','session'].map(t=>`<option ${existing?.type===t?'selected':''}>${t}</option>`).join('')}</select></label></div><label>What's on your mind?<textarea name="text" placeholder="A small win, a thought, a memory...">${esc(existing?.text||'')}</textarea></label><div class="twocol"><label>Tags, separated by commas<input name="tags" value="${esc((existing?.tags||[]).join(', '))}" placeholder="health, reading, gratitude"></label><label>Mood<select name="mood"><option value="">Not set</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${existing?.mood===n?'selected':''}>${n} / 5</option>`).join('')}</select></label></div><label>Link to a tracker<select name="trackerId">${trackerOptions(existing?.trackerId)}</select></label><label>Add photos / videos<input name="files" type="file" multiple accept="image/*,video/*"></label><small>Up to 8 files per addition, 25 MB each. New files append to existing media.</small>${existing?.media?.length?'<label style="margin-top:10px"><span><input name="clearMedia" type="checkbox"> Remove existing media</span></label>':''}<footer><button type="button" data-close>Cancel</button><button class="primary">Save entry</button></footer></form>`,root=>{$('#entryForm',root).onsubmit=async ev=>{ev.preventDefault();const f=ev.target,b=$('button.primary',f);b.disabled=true;try{const media=await filesToMedia(f.elements.files.files),timestamp=new Date(f.elemen function miniYear(year){const marked=new Set(state.entries.map(e=>e.day));const today=localDay();return `<div class="mini-year">${months.map((month,m)=>{let cells='';const first=new Date(year,m,1),offset=(first.getDay()-state.settings.weekStart+7)%7;for(let i=0;i<offset;i++)cells+='<span></span>';for(let d=1;d<=new Date(year,m+1,0).getDate();d++){const key=localDay(new Date(year,m,d));cells+=`<button data-day="${key}" class="${marked.has(key)?'marked ':''}${key===today?'today ':''}${key>today?'future':''}" title="${key}${marked.has(key)?' - annotated':''}" aria-label="${key}${marked.has(key)?', annotated':''}">${d}</button>`}return `<div class="mini-month"><h3>${month}</h3><div class="mini-days">${cells}</div></div>`}).join('')}</div>`}

function trackerCard(t){const s=summary(t);let body='';if(t.kind==='stickers'){const shown=Math.min(t.target,100);body=`<div class="stickergrid">${Array.from({length:shown},(_,i)=>`<span class="sticker ${i<t.count?'filled':''}">${i<t.count?(t.sticker&&safeMedia(t.sticker)?`<img src="${esc(t.sticker.url)}" alt="Custom sticker">`:esc(t.symbol||'✦')):i+1}</span>`).join('')}</div>${t.target>100?'<small>Showing the first 100 slots.</small>':''}<div class="row"><button data-decrement="${esc(t.id)}" ${t.count===0?'disabled':''}>- 1</button><button class="primary" data-increment="${esc(t.id)}">+ 1 step</button></div>`}else if(t.kind==='board'){const entries=state.entries.filter(e=>e.trackerId===t.id&&e.media?.length);body=`<div class="media">${entries.map(e=>mediaHTML(e.media)).join('')}</div>${entries.length?'':'<div class="empty">Collect photos, videos, and the evidence of a life lived.</div>'}<button data-board-add="${esc(t.id)}" style="margin-top:14px">+ Add to board</button>`}else{body=t.items.map(i=>`<div class="checkrow ${i.done?'done':''}"><label><input data-list-check="${esc(t.id)}" data-item="${esc(i.id)}" type="checkbox" ${i.done?'checked':''}>${esc(i.text)}</label><button class="flat danger" data-list-delete="${esc(t.id)}" data-item="${esc(i.id)}" aria-label="Delete item">×</button></div>`).join('')+`<form data-list-add="${esc(t.id)}" class="row" style="margin-top:15px"><input name="text" placeholder="Add an item" aria-label="New list item" required style="min-width:110px;flex:1;width:100%"><button>Add</button></form>`}const sessions=state.entries.filter(e=>e.trackerId===t.id&&e.durationMs!=null),time=sessions.reduce((n,e)=>n+e.durationMs,0);return `<section class="card"><div class="cardhead"><span class="badge">${{board:'Memory board',stickers:'Sticker goal',list:'Checklist'}[t.kind]}</span><button class="flat" data-edit-tracker="${esc(t.id)}">Edit</button></div>${trackerSummary(t)}${body}<div style="border-top:1px solid var(--line);margin-top:20px;padding-top: v class="empty">Your first focus session starts here.</div>'}</section>`}
function finishTimer(){const t=state.timer;if(!t)return;const ms=t.mode==='countdown'?Math.min(t.durationMs,elapsed(t)):elapsed(t);const effectiveEnd=t.mode==='countdown'&&elapsed(t)>=t.durationMs&&t.running?t.resumedAt+Math.max(0,t.durationMs-t.accumulated):Date.now();addEntry({timestamp:t.startedAt,day:localDay(new Date(t.startedAt)),timezone:t.timezone,type:'session',text:t.label||'Focus session',trackerId:t.trackerId,durationMs:Math.round(ms),startedAt:t.startedAt,endedAt:effectiveEnd});state.timer=null;lastTimerFinished=false;save();render();toast('Session saved to your calendar'+(t.trackerId?' and tracker.':'.'))}
function tick(){const now=new Date();$('#todayLabel').textContent=humanDate(now,{weekday:'long',month:'long',day:'numeric',year:'numeric'});const t=state.timer,e=elapsed(t),finished=!!(t&&t.mode==='countdown'&&e>=t.durationMs);const value=t?(t.mode==='countdown'?duration(Math.max(0,t.durationMs-e)):duration(e)):now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});if($('#clockDigits')){$('#clockDigits').textContent=value;$('#clockSub').textContent=t?(finished?'Time is up. Finish & save your session.':t.running?'One thing at a time.':'Paused - take a breath.') :humanDate(now,{weekday:'long',month:'long',day:'numeric'})}if($('#homeClock')){$('#homeClock').textContent=t?value:now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('#homeClockCaption').textContent=t?(finished?'Session complete - save it in Clock':t.running?'Focus session running':'Focus session paused'):'Your local time'}if(finished&&!lastTimerFinished){toast('Your focus timer is complete. Finish & save in Clock.');lastTimerFinished=true}}
function navigate(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){$$('.nav button').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('#app').innerHTML=page==='home'?home():page==='calendar'?calendar():page==='progress'?progressPage():clockPage();bindDays();bindEntries();if(page==='home'){if(state.decor&&safeMedia(state.decor))$('#hero').style.backgroundImage=`url("${state.decor.url}")`;$('#homeAdd').onclick=()=>entryEditor(null,localDay());$('#customize').onclick=settings;$('#yearPrev').onclick=()=>{focus=new Date(focus.getFullYear()-1,0,1);render()};$('#yearNext').onclick=()=>{focus=new Date(focus.getFullYear()+1,0,1);render()};$('#openCalendar').onclick=()=>navigate('calendar');$('#openProgress').onclick=()=>navigate('progress');$('#openClock').onclick=$('#homeClock').onclick=()=>navigate('clock')}if(page==='calendar')bindCalendar();if(page==='progress')bindProgress();if(page==='clock')bindClock();tick()}
function shiftPeriod(n){if(view==='day'||view==='week')focus.setDate(focus.getDate()+n*(view==='week'?7:1));else if(view==='month')focus=new Date(focus.getFullYear(),focus.getMonth()+n,1);else focus=new Date(focus.getFullYear()+n,focus.getMonth(),1);render()}
function bindCalendar(){$$('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$('#calendarAdd').onclick=()=>entryEditor();$('#calPrev').onclick=()=>shiftPeriod(-1);$('#calNext').onclick=()=>shiftPeriod(1);$('#calToday').onclick=()=>{focus=new Date();render()};$('#jumpDate').onchange=ev=>{if(ev.target.value){focus=parseDay(ev.target.value);render()}};const goalKey=periodKey(view),todoKey=goalKey+':todos';$('#saveGoal').onclick=()=>{state.goals[goalKey]=$('#periodGoal').value;save();$('#goalStatus').textContent='Saved';toast('Goal saved.')};$('#periodGoal').onchange=()=>{state.goals[goalKey]=$('#periodGoal').value;save()};$('#periodTodo').onsubmit=ev=>{ev.preventDefault();const text=ev.target.elements.text.value.trim();if(!text)return;state.goals[todoKey]??=[];state.goals[todoKey].push({id:uid(),text,done:false});save();render()};$$('[data-period-check]').forEach(b=>b.onchange=()=>{state.goals[todoKey].find(i=>i.id===b.dataset.periodCheck).done=b.checked;save();render()});$$('[data-period-delete]').forEach(b=>b.onclick=()=>{state.goals[todoKey]=state.goals[todoKey].filter(i=>i.id!==b.dataset.periodDelete);save();render()});$('#searchEntries').oninput=ev=>{search=ev.target.value;renderSearch()};renderSearch()}
function renderSearch(){const result=$('#searchResults');if(!result)return;const q=search.toLowerCase().trim();if(!q){result.innerHTML='<small>Search spans every year, not just the selected view.</small>';return}const hits=state.entries.filter(e=>[e.text,...e.tags,trackerLabel(e.trackerId),e.day].join(' ').toLowerCase().includes(q)).sort((a,b)=>b.timestamp-a.timestamp);result.innerHTML=`<small>${hits.length} results${hits.length>50?' · showing the latest 50':''}</small>`+hits.slice(0,50).map(e=>`<div><button data-result-day="${e.day}" class="flat">${e.day} ↗</button>${entryHTML(e)}</div>`).join('');bindEntries(result);$$('[data-result-day]',result).forEach(b=>b.onclick=()=>{focus=parseDay(b.dataset.resultDay);view='day';render()})}
function bindProgress(){$('#newTracker').onclick=()=>trackerEditor();if($('#firstTracker'))$('#firstTracker').onclick=()=>trackerEditor();$$('[data-edit-tracker]').forEach(b=>b.onclick=()=>trackerEditor(state.trackers.find(t=>t.id===b.dataset.editTracker)));$$('[data-board-add]').forEach(b=>b.onclick=()=>addBoard(b.dataset.boardAdd));$$('[data-increment],[data-decrement]').forEach(b=>b.onclick=()=>{const id=b.dataset.increment||b.dataset.decrement,t=state.trackers.find(t=>t.id===id),delta=b.dataset.increment?1:-1;t.count=Math.max(0,t.count+delta);addEntry({type:'habit',text:`${t.label}: ${delta>0?'+1':'-1'} (${t.count} total)`,trackerId:id});save();render()});$$('[data-list-add]').forEach(f=>f.onsubmit=ev=>{ev.preventDefault();const text=f.elements.text.value.trim();if(!text)return;state.trackers.find(t=>t.id===f.dataset.listAdd).items.push({id:uid(),text,done:false});save();render()});$$('[data-list-check]').forEach(b=>b.onchange=()=>{const t=state.trackers.find(t=>t.id===b.dataset.listCheck),i=t.items.find(i=>i.id===b.dataset.item);i.done=b.checked;addEntry({type:'goal',text:`${i.done?'Completed':'Reopened'}: ${i.text}`,trackerId:t.id});save();render()});$$('[data-list-delete]').forEach(b=>b.onclick=()=>{const t=state.trackers.find(t=>t.id===b.dataset.listDelete);t.items=t.items.filter(i=>i.id!==b.dataset.item);save();render()})}
function bindClock(){if(state.timer){$('#pauseTimer').onclick=()=>{const t=state.timer;if(t.running){t.accumulated=elapsed(t);t.running=false}else{if(t.mode==='countdown'&&t.accumulated>=t.durationMs){toast('This timer is complete. Finish & save it first.');return}t.resumedAt=Date.now();t.running=true}save();render()};$('#finishTimer').onclick=finishTimer;$('#discardTimer').onclick=()=>{if(confirm('Discard this session without saving it?')){state.timer=null;lastTimerFinished=false;save();render()}}}else{const f=$('#timerForm');f.elements.mode.onchange=()=>{$('#minutesLabel').hidden=f.elements.mode.value==='stopwatch';f.elements.minutes.required=f.elements.mode.value==='countdown'};f.onsubmit=ev=>{ev.preventDefault();const now=Date.now();state.timer={startedAt:now,resumedAt:now,timezone:zone(),accumulated:0,running:true,mode:f.elements.mode.value,durationMs:Number(f.elements.minutes.value)*60000,label:f.elements.label.value.trim(),trackerId:f.elements.trackerId.value||null};lastTimerFinished=false;save();render()}}}
function download(name,text){const url=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function settings(){modal(`<h2>Make yourself at home.</h2><form id="settingsForm"><label>Home page title<input name="name" maxlength="100" value="${esc(state.settings.name)}"></label><label>Start weeks on<select name="weekStart"><option value="1" ${state.settings.weekStart===1?'selected':''}>Monday</option><option value="0" ${state.settings.weekStart===0?'selected':''}>Sunday</option></select></label><label>Home cover photo or GIF<input name="decorFile" type="file" accept="image/*"></label>${state.decor?'<label><span><input name="clearDecor" type="checkbox"> Remove cover image</span></label>':''}<footer><button data-close type="button">Cancel</button><button class="primary">Save appearance</button></footer></form><hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><h3>Your notebook belongs to you.</h3><p class="steps" style="margin:10px 0 18px">Saved locally in this browser, not synced across devices. Keep backups: browser data can be cleared, and private browsing may not retain it. Exports include all notes, media, goals, and the current timer.</p><div class="row"><button id="exportData">Export backup</button><button id="importData">Restore backup</button><button id="persistData">Request storage protection</button></div><p class="steps" style="margin-top:16px">Sticker and checklist edits create activity entries. Deleting an activity entry does not undo the tracker's current count or checklist state. Goals stay in their original periods; nothing resets or rolls over automatically.</p>`,root=>{$('#settingsForm',root).onsubmit=async ev=>{ev.preventDefault();const f=ev.target,b=$('button.primary',f);b.disabled=true;try{const files=await filesToMedia(f.elements.decorFile.files);if(files.some(m=>!m.type.startsWith('image/')))throw Error('Choose an image or GIF for your cover.');state.settings.name=f.elements.name.value.trim()||'My year, my pace';state.settings.weekStart=Number(f.elements.weekStart.value);if(files[0])state.decor=files[0];else if(f.elements.clearDecor?.checked)state.decor=null;await save();$('#modal').close();render()}catch(e){toast(e.message)}finally{b.disabled=false}};$('#exportData',root).onclick=()=>{download('yearbook-backup-'+localDay()+'.json',JSON.stringify(state));toast('Backup prepared. Keep the downloaded file safe.')};$('#importData',root).onclick=()=>$('#restoreFile').click();$('#persistData',root).onclick=async()=>{try{const granted=await navigator.storage?.persist?.();toast(granted?'Storage protection granted. Still keep backups.':'Storage protection was not granted by this browser. Keep backups.')}catch(e){toast('Storage protection is unavailable here. Keep backups.')}}})}
function validate(s){const fail=()=>{throw Error('This is not a valid Yearbook backup.')};if(!s||s.version!==1||!Array.isArray(s.entries)||!Array.isArray(s.trackers)||!s.goals||typeof s.goals!=='object'||Array.isArray(s.goals)||!s.settings||typeof s.settings.name!=='string'||![0,1].includes(s.settings.weekStart))fail();const str=v=>typeof v==='string';const checkMedia=a=>Array.isArray(a)&&a.every(m=>safeMedia(m)&&str(m.type)&&str(m.name));if(s.decor&&!safeMedia(s.decor))fail();for(const e of s.entries){if(!str(e.id)||!Number.isFinite(e.timestamp)||!str(e.day)||!/^\d{4}-\d{2}-\d{2}$/.test(e.day)||!str(e.text)||!str(e.type)||!Array.isArray(e.tags)||!e.tags.every(str)||!checkMedia(e.media)||e.durationMs!=null&&(!Number.isFinite(e.durationMs)||e.durationMs<0))fail()}for(const t of s.trackers){if(!str(t.id)||!str(t.label)||!['board','stickers','list'].includes(t.kind)||!Number.isInteger(t.count)||t.count<0||!Number.isInteger(t.target)||t.target<0||t.kind==='stickers'&&t.target<1||!Array.isArray(t.items)||!t.items.every(i=>str(i.id)&&str(i.text)&&typeof i.done==='boolean')||t.sticker&&!safeMedia(t.sticker))fail()}for(const [k,v]of Object.entries(s.goals)){if(k==='__proto__'||k==='constructor'||k==='prototype')fail();if(k.endsWith(':todos')){if(!Array.isArray(v)||!v.every(i=>str(i.id)&&str(i.text)&&typeof i.done==='boolean'))fail()}else if(!str(v))fail()}if(s.timer){const t=s.timer;if(!['countdown','stopwatch'].includes(t.mode)||![t.startedAt,t.resumedAt,t.accumulated,t.durationMs].every(Number.isFinite)||t.accumulated<0||t.durationMs<0||typeof t.running!=='boolean'||!str(t.label))fail()}}
$('#restoreFile').onchange=async ev=>{const file=ev.target.files[0];if(!file)return;try{const next=JSON.parse(await file.text());validate(next);if(!confirm('Replace this notebook with the backup? Export your current notebook first if you want to keep it.'))return;state=next;lastTimerFinished=false;await save();$('#modal').close();render();toast('Backup restored.')}catch(e){toast(e.message)}finally{ev.target.value=''}};
$$('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));$('#settingsSide').onclick=$('#settingsTop').onclick=settings;document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
(async()=>{await openStorage();render();setInterval(tick,500)})();
</script></body></html>
